<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 🖤</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% 30%, #35101d 0%, #160810 38%, #080308 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: white;
}

.contenedor {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 25px 10px 40px;
}

h1 {
    margin: 0 0 5px;
    font-size: clamp(28px, 6vw, 48px);
    color: #ffd5df;
    text-shadow:
        0 0 10px #ff4f7b,
        0 0 25px rgba(255, 50, 100, .5);
    text-align: center;
}

.subtitulo {
    margin: 0 0 15px;
    color: #e9b9c8;
    font-size: 16px;
    text-align: center;
}

/* =========================================================
   RAMO
   ========================================================= */

.ramo {
    position: relative;
    width: 620px;
    height: 620px;
    margin: 0 auto;
}

/* =========================================================
   TALLOS
   ========================================================= */

.tallo {
    position: absolute;
    left: 50%;
    bottom: 100px;

    width: 7px;
    height: 360px;

    background: linear-gradient(
        to right,
        #173e22,
        #4e9b55,
        #1d5628
    );

    border-radius: 10px;
    transform-origin: bottom center;

    box-shadow:
        0 0 4px rgba(91, 180, 92, .45);

    z-index: 2;
}

/*
   Los tallos forman un abanico.
   Los negativos van hacia X negativo (izquierda).
   Los positivos van hacia X positivo (derecha).
*/

.t1  { transform: rotate(-50deg); }
.t2  { transform: rotate(-42deg); }
.t3  { transform: rotate(-34deg); }
.t4  { transform: rotate(-26deg); }
.t5  { transform: rotate(-18deg); }
.t6  { transform: rotate(-9deg); }

.t7  { transform: rotate(9deg); }
.t8  { transform: rotate(18deg); }
.t9  { transform: rotate(26deg); }
.t10 { transform: rotate(34deg); }
.t11 { transform: rotate(43deg); }
.t12 { transform: rotate(52deg); }

/* =========================================================
   HOJAS
   ========================================================= */

.hoja {
    position: absolute;
    width: 45px;
    height: 20px;

    background: linear-gradient(
        135deg,
        #5cae5f,
        #173c20
    );

    border-radius: 100% 0 100% 0;
    z-index: 4;

    box-shadow: 0 0 7px rgba(79, 157, 79, .25);
}

.h1 {
    left: 190px;
    top: 335px;
    transform: rotate(-28deg);
}

.h2 {
    left: 230px;
    top: 375px;
    transform: rotate(25deg);
}

.h3 {
    left: 365px;
    top: 330px;
    transform: rotate(30deg);
}

.h4 {
    left: 400px;
    top: 380px;
    transform: rotate(-25deg);
}

.h5 {
    left: 115px;
    top: 350px;
    transform: rotate(-45deg);
}

.h6 {
    left: 465px;
    top: 350px;
    transform: rotate(42deg);
}

.h7 {
    left: 520px;
    top: 390px;
    transform: rotate(55deg);
}

/* =========================================================
   FLORES
   ========================================================= */

.flor {
    position: absolute;
    width: 80px;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    z-index: 8;

    filter:
        drop-shadow(0 5px 8px rgba(0,0,0,.5))
        drop-shadow(0 0 8px rgba(255,80,130,.25));

    user-select: none;
}

/* Rosas */

.rosa {
    font-size: 67px;
}

/* Violetas */

.violeta {
    font-size: 58px;
}

/* =========================================================
   FLORES PRINCIPALES — CENTRO
   ========================================================= */

.r1 {
    left: 158px;
    top: 138px;
    transform: rotate(-18deg) scale(.92);
}

.r2 {
    left: 380px;
    top: 138px;
    transform: rotate(18deg) scale(.92);
}

.r3 {
    left: 145px;
    top: 275px;
    transform: rotate(-22deg) scale(.88);
}

.r4 {
    left: 365px;
    top: 275px;
    transform: rotate(22deg) scale(.88);
}

.r5 {
    left: 270px;
    top: 92px;
    transform: rotate(0deg) scale(.98);
}

/* =========================================================
   FLORES LATERALES IZQUIERDAS
   ========================================================= */

.r6 {
    left: -5px;
    top: 248px;
    transform: rotate(-42deg) scale(.78);
}

.r8 {
    left: 70px;
    top: 180px;
    transform: rotate(-30deg) scale(.82);
}

/* =========================================================
   FLORES LATERALES DERECHAS
   ========================================================= */

/*
   Estas son las que extienden el ramo
   hacia el eje X positivo.
*/

.r7 {
    left: 545px;
    top: 248px;
    transform: rotate(42deg) scale(.78);
}

.r9 {
    left: 470px;
    top: 180px;
    transform: rotate(30deg) scale(.82);
}

/* =========================================================
   FLORES PEQUEÑAS / VIOLETAS
   ========================================================= */

.v1 {
    left: 215px;
    top: 125px;
    transform: rotate(-10deg) scale(.8);
}

.v2 {
    left: 327px;
    top: 125px;
    transform: rotate(10deg) scale(.8);
}

.v3 {
    left: 112px;
    top: 160px;
    transform: rotate(-20deg) scale(.78);
}

.v4 {
    left: 428px;
    top: 160px;
    transform: rotate(20deg) scale(.78);
}

.v5 {
    left: 225px;
    top: 260px;
    transform: rotate(-15deg) scale(.8);
}

.v6 {
    left: 335px;
    top: 260px;
    transform: rotate(15deg) scale(.8);
}

/* Lateral izquierdo */

.v7 {
    left: 35px;
    top: 220px;
    transform: rotate(-30deg) scale(.75);
}

.v8 {
    left: 85px;
    top: 300px;
    transform: rotate(-35deg) scale(.72);
}

/* =========================================================
   LATERAL DERECHO — EXTENDIDO
   ========================================================= */

.v9 {
    left: 510px;
    top: 220px;
    transform: rotate(25deg) scale(.82);
}

.v10 {
    left: 555px;
    top: 300px;
    transform: rotate(35deg) scale(.75);
}

.v11 {
    left: 480px;
    top: 335px;
    transform: rotate(28deg) scale(.78);
}

.v12 {
    left: 535px;
    top: 375px;
    transform: rotate(42deg) scale(.68);
}

/* Flores inferiores */

.v13 {
    left: 185px;
    top: 335px;
    transform: rotate(-25deg) scale(.72);
}

.v14 {
    left: 360px;
    top: 335px;
    transform: rotate(25deg) scale(.72);
}

/* =========================================================
   HOT WHEELS
   ========================================================= */

.carrito {
    position: absolute;
    z-index: 10;

    cursor: pointer;

    object-fit: contain;

    filter:
        drop-shadow(0 6px 7px rgba(0,0,0,.65))
        drop-shadow(0 0 7px rgba(255,255,255,.12));

    transition:
        transform .3s ease,
        filter .3s ease;
}

.carrito:hover {
    filter:
        drop-shadow(0 8px 10px rgba(0,0,0,.7))
        drop-shadow(0 0 14px rgba(255,70,120,.55));
}

/* Carritos */

.c1 {
    left: 25px;
    top: 80px;
    width: 145px;
    transform: rotate(-15deg);
}

.c2 {
    left: 170px;
    top: 45px;
    width: 150px;
    transform: rotate(-5deg);
}

.c3 {
    left: 325px;
    top: 50px;
    width: 150px;
    transform: rotate(5deg);
}

.c4 {
    left: 455px;
    top: 105px;
    width: 150px;
    transform: rotate(15deg);
}

.c5 {
    left: 45px;
    top: 225px;
    width: 155px;
    transform: rotate(-13deg);
}

.c6 {
    left: 220px;
    top: 220px;
    width: 155px;
    transform: rotate(3deg);
}

.c7 {
    left: 400px;
    top: 225px;
    width: 160px;
    transform: rotate(14deg);
}

/* Nuestro carrito */

.our {
    left: 275px;
    top: 395px;
    width: 110px;

    transform: rotate(-3deg);

    z-index: 11;
}

/* =========================================================
   ENVOLTURA / "MACETA"
   ========================================================= */

/*
   Eliminado el cuadro negro.
   Ahora la envoltura es un papel de ramo limpio,
   centrado y simétrico.
*/

.envoltura {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    width: 390px;
    height: 190px;

    background:
        linear-gradient(
            135deg,
            #160b13,
            #351020 45%,
            #160810
        );

    clip-path: polygon(
        8% 0%,
        92% 0%,
        100% 100%,
        0% 100%
    );

    border-radius: 8px;

    z-index: 5;

    box-shadow:
        0 15px 25px rgba(0,0,0,.5);
}

/* Pliegues decorativos */

.envoltura::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            115deg,
            transparent 0 42%,
            rgba(255,255,255,.07) 43% 44%,
            transparent 45% 55%,
            rgba(255,255,255,.05) 56% 57%,
            transparent 58%
        );

    pointer-events: none;
}

/* =========================================================
   CINTA
   ========================================================= */

.cinta {
    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: 95px;
    height: 48px;

    z-index: 15;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ffd6df;
    font-size: 30px;

    text-shadow:
        0 0 8px #ff4777;
}

/* =========================================================
   CORAZONES FLOTANTES
   ========================================================= */

.corazones {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 18;
}

.corazon {
    position: absolute;

    color: #ff6b93;

    font-size: var(--size);

    opacity: 0;

    text-shadow:
        0 0 7px #ff315f,
        0 0 15px rgba(255, 50, 100, .7);

    animation:
        flotar var(--duracion) ease-in-out infinite;

    animation-delay: var(--delay);
}

@keyframes flotar {

    0% {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.55)
            rotate(0deg);
    }

    15% {
        opacity: .9;
    }

    50% {
        opacity: 1;
        transform:
            translateY(-75px)
            scale(1)
            rotate(10deg);
    }

    75% {
        opacity: .7;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-190px)
            scale(.6)
            rotate(-12deg);
    }
}

/* =========================================================
   MENSAJE / BOTÓN
   ========================================================= */

.hint {
    margin-top: 5px;

    color: #d9aeba;

    font-size: 14px;

    text-align: center;
}

button {
    margin-top: 12px;

    border: 1px solid #ff658b;
    border-radius: 25px;

    padding: 12px 24px;

    background:
        linear-gradient(
            135deg,
            #3a1020,
            #1a0811
        );

    color: #ffdbe4;

    font-family: Georgia, serif;
    font-size: 15px;

    cursor: pointer;

    box-shadow:
        0 0 12px rgba(255,75,120,.3);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 20px rgba(255,75,120,.55);
}

/* =========================================================
   MODAL
   ========================================================= */

.modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.78);

    z-index: 100;
}

.modal.activo {
    display: flex;
}

.modal-contenido {
    width: min(500px, 92vw);

    max-height: 85vh;

    overflow-y: auto;

    padding: 30px 25px;

    background:
        linear-gradient(
            145deg,
            #220b15,
            #10050b
        );

    border:
        1px solid rgba(255,100,140,.55);

    border-radius: 20px;

    box-shadow:
        0 0 30px rgba(255,50,100,.3);

    text-align: center;

    animation: aparecer .35s ease;
}

.modal-contenido h2 {
    margin-top: 0;

    color: #ffb7c9;

    text-shadow:
        0 0 10px rgba(255,80,120,.6);
}

.modal-contenido p {
    color: #f2dbe2;

    line-height: 1.7;

    font-size: 16px;
}

.cerrar {
    margin-top: 15px;

    background: #3b1020;

    border-color: #ff668b;
}

@keyframes aparecer {

    from {
        opacity: 0;
        transform: scale(.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 600px) {

    /*
       El ramo conserva sus proporciones internas,
       pero se reduce completo para que los tallos
       y flores no se desorganicen.
    */

    .ramo {
        transform: scale(.56);
        transform-origin: top center;

        margin-bottom: -270px;
    }

    .contenedor {
        padding-top: 20px;
    }

    .subtitulo {
        font-size: 14px;
    }

    .hint {
        font-size: 13px;
        max-width: 300px;
    }

    .modal-contenido {
        padding: 25px 20px;
    }
}

@media (max-width: 380px) {

    .ramo {
        transform: scale(.50);
        margin-bottom: -305px;
    }
}
</style>
</head>

<body>

        titulo: "💌 Para ti",
        texto:
            "No puedo regalarte un ramo físicamente, así que hice este. Cada carrito representa algo que quiero compartir contigo. Te amo y quiero darte las gracias por estar en mi vida, por hacerme la mujer más feliz de la Tierra, por ser mío... Te amo mucho más de lo que puedes imaginar... Te amo mucho Jere ❤️"
    }

};

/* =========================================================
   ABRIR MODAL
   ========================================================= */

function abrirModal(tipo) {

    const mensaje = mensajes[tipo];

    if (!mensaje) return;

    document.getElementById("modalTitulo").textContent =
        mensaje.titulo;

    document.getElementById("modalTexto").textContent =
        mensaje.texto;

    document.getElementById("modal").classList.add("activo");
}

/* =========================================================
   CERRAR MODAL
   ========================================================= */

function cerrarModal(event) {

    if (
        event &&
        event.target &&
        event.target.id !== "modal"
    ) {
        return;
    }

    document
        .getElementById("modal")
        .classList.remove("activo");
}

/* =========================================================
   ESC PARA CERRAR
   ========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        cerrarModal();
    }

});

</script>
